name: ROS 2 CI

on:
  push:
    branches:
      - main
      - develop
      - "**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      IMAGE_NAME: inrof2026-koma-ci
      CONTAINER_NAME: inrof2026-koma-ci-container
      IMAGE_TAR: /tmp/inrof2026-koma-ci-image.tar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Docker image cache
        id: docker-image-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.IMAGE_TAR }}
          key: docker-image-${{ runner.os }}-${{ hashFiles('docker/ros/Dockerfile', 'docker/ros/**') }}

      - name: Load Docker image from cache
        if: steps.docker-image-cache.outputs.cache-hit == 'true'
        run: |
          docker load -i "${IMAGE_TAR}"

      - name: Build Docker image
        if: steps.docker-image-cache.outputs.cache-hit != 'true'
        run: |
          docker build \
            -t "${IMAGE_NAME}:latest" \
            -f docker/ros/Dockerfile \
            docker/ros

      - name: Save Docker image to cache
        if: steps.docker-image-cache.outputs.cache-hit != 'true'
        run: |
          docker save "${IMAGE_NAME}:latest" -o "${IMAGE_TAR}"

      - name: Start container
        run: |
          docker run -d \
            --name "${CONTAINER_NAME}" \
            -v "${GITHUB_WORKSPACE}:/work/inrof2026_koma" \
            -w /work/inrof2026_koma \
            "${IMAGE_NAME}:latest" \
            tail -f /dev/null

      - name: Run rosdep
        run: |
          docker exec "${CONTAINER_NAME}" bash -lc "
            set -e
            source /opt/ros/humble/setup.bash
            apt-get update
            rosdep update
            rosdep install --from-paths src --ignore-src -r -y
          "

      - name: Run colcon build
        run: |
          docker exec "${CONTAINER_NAME}" bash -lc "
            set -e
            source /opt/ros/humble/setup.bash
            colcon build --symlink-install
          "

      - name: Show colcon logs on failure
        if: failure()
        run: |
          docker exec "${CONTAINER_NAME}" bash -lc "
            if [ -d log/latest_build ]; then
              find log/latest_build -name '*.log' -type f -maxdepth 3 -print -exec tail -n 120 {} \;
            fi
          " || true

      - name: Stop container
        if: always()
        run: |
          docker rm -f "${CONTAINER_NAME}" || true