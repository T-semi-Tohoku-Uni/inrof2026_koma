name: ROS2 code format test

on:
  push:
    branches:
      - '*'

jobs:
  test:
    name: format
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: install dependency
        run: |
            sudo apt-get update
            sudo apt install -y clang-format
            sudo apt install -y ros-humble-ament-cmake-clang-format ros-humble-ament-clang-format

      - name: format test
        run: |
          source /opt/ros/humble/setup.bash
          find ./src \
            \( -path './src/*/include/*.hpp' -o -path './src/*/src/*.cpp' \) \
            $(git submodule status | awk '{print "! -path ./" $2 "/*"}') \
            -print0 \
          | xargs -0 ament_clang_format